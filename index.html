<!doctype html>

<html lang="ja">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#111827">

<link rel="manifest" href="manifest.json">

<title>競馬データ成長アプリ 第2版</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#f3f4f6;

  color:#17202a;

  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;

}

header{

  background:#111827;

  color:white;

  padding:18px 16px;

  font-size:20px;

  font-weight:bold;

}

main{padding:16px;max-width:700px;margin:auto}

.card{

  background:white;

  border-radius:14px;

  padding:16px;

  margin-bottom:14px;

  box-shadow:0 2px 8px rgba(0,0,0,.08);

}

h2{font-size:18px;margin:0 0 12px}

button{

  width:100%;

  border:0;

  border-radius:10px;

  padding:13px;

  margin-top:8px;

  font-size:16px;

  font-weight:bold;

  background:#111827;

  color:white;

}

button.sub{background:#6b7280}

button.danger{background:#b91c1c}

input,select{

  width:100%;

  padding:11px;

  border:1px solid #d1d5db;

  border-radius:8px;

  font-size:16px;

  margin:5px 0;

}

.row{

  display:flex;

  gap:8px;

  align-items:center;

}

.row>*{flex:1}

.preview{

  width:100%;

  max-height:300px;

  object-fit:contain;

  border-radius:10px;

  margin-top:10px;

  display:none;

}

.result{

  padding:10px;

  border-bottom:1px solid #e5e7eb;

}

.gap{

  background:#fff7ed;

  border:2px solid #f97316;

  border-radius:10px;

  padding:10px;

  margin:8px 0;

}

.longshot{

  background:#fef2f2;

  border:2px solid #dc2626;

  border-radius:10px;

  padding:12px;

  font-weight:bold;

}

.small{font-size:13px;color:#6b7280}

.hidden{display:none}

</style>

</head>

<body>

<header>🏇 競馬データ成長アプリ 第2版</header>

<main>

<div class="card">

  <h2>① レース情報</h2>

  <div class="row">

    <input id="raceDate" type="date">

    <input id="raceName" type="text" placeholder="例：京都12R">

  </div>

  <button onclick="saveRace()">💾 このレースを保存</button>

</div>

<div class="card">

  <h2>② オッズ写真</h2>

  <input

    id="photoInput"

    type="file"

    accept="image/*"
    
    multiple

    onchange="showPhoto(event)"

  >

  <img id="preview" class="preview">

  <p class="small">

    「写真を選択」を押すと、iPhoneの写真から画像を選べます。<br>

    カメラを直接起動する方式ではありません。

  </p>

</div>

<div class="card">

  <h2>③ 1番人気を設定</h2>

  <input

    id="favorite"

    type="number"

    min="1"

    max="18"

    placeholder="1番人気の馬番"

  >

  <button onclick="createHorses()">馬番入力欄を作る</button>

  <div id="horseInputs"></div>

</div>

<div class="card">

  <h2>④ 馬単オッズを入力</h2>

  <p class="small">

    1番人気→相手 と 相手→1番人気 を入力します。

  </p>

  <div id="oddsInputs"></div>

  <button onclick="calculate()">📊 オッズ差を計算</button>

</div>

<div class="card hidden" id="resultCard">

  <h2>⑤ 計算結果</h2>

  <div id="results"></div>

</div>

<div class="card">

  <h2>⑥ 保存したレース</h2>

  <div id="savedRaces"></div>

  <button class="danger" onclick="clearRaces()">

    保存データを全部削除

  </button>

</div>

</main>

<script>

let horses = [];

let lastResults = [];

/* 写真表示 */

function showPhoto(event){

  const file = event.target.files[0];

  if(!file) return;

  const preview = document.getElementById("preview");

  preview.src = URL.createObjectURL(file);

  preview.style.display = "block";

}

/* 馬番入力欄作成 */

function createHorses(){

  const favorite =

    Number(document.getElementById("favorite").value);

  if(!favorite){

    alert("1番人気の馬番を入力してください");

    return;

  }

  horses = [];

  let html = "";

  for(let i=1;i<=18;i++){

    if(i === favorite) continue;

    horses.push(i);

    html += `

      <div class="row">

        <div>

          <strong>${i}番</strong>

        </div>

        <input

          id="horse_${i}"

          type="number"

          min="1"

          step="0.1"

          placeholder="単勝オッズ"

        >

      </div>

    `;

  }

  document.getElementById("horseInputs").innerHTML = html;

  createOddsInputs();

}

/* 馬単入力欄 */

function createOddsInputs(){

  let html = "";

  const favorite =

    Number(document.getElementById("favorite").value);

  horses.forEach(horse => {

    html += `

      <div class="card" style="padding:12px;margin:8px 0">

        <strong>${favorite}番 → ${horse}番</strong>

        <input

          id="odds_${favorite}_${horse}"

          type="number"

          min="0"

          step="0.1"

          placeholder="${favorite}→${horse} 馬単オッズ"

        >

        <strong>${horse}番 → ${favorite}番</strong>

        <input

          id="odds_${horse}_${favorite}"

          type="number"

          min="0"

          step="0.1"

          placeholder="${horse}→${favorite} 馬単オッズ"

        >

      </div>

    `;

  });

  document.getElementById("oddsInputs").innerHTML = html;

}

/* 計算 */

function calculate(){

  const favorite =

    Number(document.getElementById("favorite").value);

  if(!favorite){

    alert("1番人気を設定してください");

    return;

  }

  let data = [];

  horses.forEach(horse => {

    const forward =

      Number(

        document.getElementById(

          `odds_${favorite}_${horse}`

        ).value

      );

    const reverse =

      Number(

        document.getElementById(

          `odds_${horse}_${favorite}`

        ).value

      );

    if(forward > 0 && reverse > 0){

      /*

       重要：

       1番人気→相手

       −

       相手→1番人気

      */

      const difference = forward - reverse;

      data.push({

        horse:horse,

        forward:forward,

        reverse:reverse,

        difference:difference

      });

    }

  });

  if(data.length < 2){

    alert("2頭以上のオッズを入力してください");

    return;

  }

  /* 差を小さい順 */

  data.sort((a,b) =>

    a.difference - b.difference

  );

  lastResults = data;

  let html = "";

  html += `

    <div class="small">

      基準馬：${favorite}番

    </div>

  `;

  /* 並び順 */

  data.forEach((item,index)=>{

    html += `

      <div class="result">

        <strong>${index+1}位　${item.horse}番</strong><br>

        ${favorite}→${item.horse}：

        ${item.forward}<br>

        ${item.horse}→${favorite}：

        ${item.reverse}<br>

        <strong>

          差：${item.difference.toFixed(1)}

        </strong>

      </div>

    `;

  });

  /* 隣同士の差 */

  html += `

    <h3>📐 隣同士の段差</h3>

  `;

  let longshots = [];

  for(let i=0;i<data.length-1;i++){

    const upper = data[i];

    const lower = data[i+1];

    const gap =

      lower.difference - upper.difference;

    html += `

      <div class="gap">

        ${upper.horse}番

        →

        ${lower.horse}番

        <br>

        ${upper.difference.toFixed(1)}

        →

        ${lower.difference.toFixed(1)}

        <br>

        <strong>

          段差：${gap.toFixed(1)}

        </strong>

      </div>

    `;

    /*

      10以上の段差なら

      「上側＝直前の馬」を穴候補

    */

    if(gap >= 10){

      longshots.push({

        horse:upper.horse,

        gap:gap

      });

    }

  }

  if(longshots.length){

    html += `

      <h3>🚨 10以上の境目</h3>

    `;

    longshots.forEach(item=>{

      html += `

        <div class="longshot">

          穴候補：${item.horse}番<br>

          境目：${item.gap.toFixed(1)}

        </div>

      `;

    });

  }else{

    html += `

      <div class="small">

        10以上の大きな境目はありません。

      </div>

    `;

  }

  document.getElementById("results").innerHTML = html;

  document

    .getElementById("resultCard")

    .classList.remove("hidden");

}

/* レース保存 */

function saveRace(){

  const date =

    document.getElementById("raceDate").value;

  const name =

    document.getElementById("raceName").value;

  if(!name){

    alert("レース名を入力してください");

    return;

  }

  const saved =

    JSON.parse(

      localStorage.getItem("keibaRaces") || "[]"

    );

  saved.push({

    date:date,

    name:name,

    favorite:

      document.getElementById("favorite").value,

    results:lastResults,

    savedAt:new Date().toLocaleString("ja-JP")

  });

  localStorage.setItem(

    "keibaRaces",

    JSON.stringify(saved)

  );

  displaySaved();

  alert("レースデータを保存しました！");

}

/* 保存データ表示 */

function displaySaved(){

  const saved =

    JSON.parse(

      localStorage.getItem("keibaRaces") || "[]"

    );

  const box =

    document.getElementById("savedRaces");

  if(saved.length === 0){

    box.innerHTML =

      '<div class="small">まだ保存されたレースはありません。</div>';

    return;

  }

  let html = "";

  saved.slice().reverse().forEach((race,index)=>{

    html += `

      <div class="result">

        <strong>

          ${race.date || ""}

          ${race.name}

        </strong>

        <br>

        1番人気：

        ${race.favorite || "-"}

        <br>

        保存：

        ${race.savedAt}

      </div>

    `;

  });

  box.innerHTML = html;

}

/* 保存データ削除 */

function clearRaces(){

  if(

    !confirm(

      "保存したレースデータを全部削除しますか？"

    )

  ) return;

  localStorage.removeItem("keibaRaces");

  displaySaved();

  alert("保存データを削除しました。");

}

/* 起動時 */

displaySaved();

</script>

</body>

</html>
